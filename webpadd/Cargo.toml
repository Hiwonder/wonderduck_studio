[package]
name = "webpadd"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "LAN browser to robot intents"

[dependencies]
duck-control = { path = "../../../duck-control" }
duck-ipc-proto = { path = "../../../duck-ipc-proto" }
duck-detect = { path = "../../../duck-detect" }
robotd-params = { path = "../../../robotd-params" }
uyvy = { path = "../../../uyvy" }
anyhow = "1"
libc = "0.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
